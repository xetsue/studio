<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio</title>
    <script src="js/WebAudioFontPlayer.js"></script>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --text-color: #000000;
            --tile-bg: #000000;
            --tile-text: #ffffff;
            --border-color: #ccc;
            --accent-color: #d32f2f;
            --highlight-color: #ff0000;
            --fret-wire: #bbb;
            --string-color: #333;
            --glass-bg: rgba(0, 0, 0, 0.1);
            --capo-color: #ff8c00;
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #ffffff;
            --tile-bg: #ffffff;
            --tile-text: #000000;
            --border-color: #333;
            --accent-color: #d32f2f;
            --highlight-color: #ff0000;
            --fret-wire: #555;
            --string-color: #888;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --capo-color: #ff8c00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Monospace', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s, color 0.3s;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            font-size: 1.1em;
            font-weight: bold;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            height: 50px;
            background: var(--bg-color);
        }

        .corner-btn {
            background: var(--text-color);
            border: 2px solid var(--text-color);
            color: var(--bg-color);
            font-family: inherit;
            font-size: 1.1em;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-weight: bold;
        }

        .vol-control {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7em;
        }

        .vol-control input[type="range"] {
            width: 70px;
            cursor: pointer;
        }

        .vol-control input[type="number"] {
            width: 40px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            font-family: inherit;
            text-align: center;
        }

        #menuView {
            display: flex;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        #tileGrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 360px;
        }

        .tile {
            width: 150px;
            height: 150px;
            background-color: var(--tile-bg);
            color: var(--tile-text);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .label-wrapper {
            display: flex;
            justify-content: flex-start;
            width: var(--w);
        }

        .tile span {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid transparent;
            width: 100%;
            text-align: left;
        }

        .tile:hover span {
            border-right: 2px solid var(--tile-text);
            animation: typing 0.5s steps(var(--s)) forwards, blink-caret 0.75s step-end infinite;
        }

        @keyframes typing { 
            0% { width: 0; } 
            100% { width: 100%; } 
        }
        @keyframes blink-caret { from, to { border-color: transparent; } 50% { border-color: var(--tile-text); } }

        .instrument-view {
            display: none;
            flex-grow: 1;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 50px);
            height: calc(100dvh - 50px);
            position: relative;
            overflow: hidden;
        }

        .instrument-view.active { display: flex; }

        .controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            gap: 15px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            font-size: 0.9em;
            height: 60px;
        }

        .controls-bar button {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .controls-bar input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px;
            width: 50px;
            text-align: center;
            font-family: inherit;
            font-size: 1em;
        }

        #pianoContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            gap: 15px;
            overflow: hidden;
        }

        .mobile-key-row {
            display: flex;
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 90px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .mobile-key {
            border: 1px solid #888;
            box-sizing: border-box;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            cursor: pointer;
            font-size: 0.8em;
            color: #555;
            user-select: none;
            transition: background-color 0.05s;
        }

        .mobile-key.white {
            flex: 1;
            background: #fff;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            z-index: 1;
            height: 100%;
        }
        
        .mobile-key.black {
            position: absolute;
            height: 60%;
            background: #000;
            z-index: 10;
            border-bottom-left-radius: 2px;
            border-bottom-right-radius: 2px;
            top: 0;
            color: white;
        }

        .mobile-key.active-red {
            background: var(--highlight-color) !important;
            color: white;
        }

        #kalimbaContainer {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-grow: 1;
            padding: 20px 10px;
            gap: 4px;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .k-tine {
            flex: 1;
            min-width: 0;
            max-width: 45px;
            background: linear-gradient(to bottom, #999, #eee);
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            color: #000;
            font-weight: bold;
            font-size: 0.7em;
            box-shadow: 0 4px 5px rgba(0,0,0,0.3);
            transition: height 0.2s, transform 0.1s, background-color 0.1s;
            user-select: none;
        }
        
        .k-tine.active-red {
            transform: translateY(10px);
            background: var(--highlight-color);
            color: white;
        }

        #guitarLayout {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        #guitarPlaylist {
            width: 250px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            flex-shrink: 0;
            z-index: 5;
        }

        #guitarFretboard {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            overflow: hidden;
            margin: 10px;
        }

        .playlist-header {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 5px;
        }

        .pl-head-controls {
            display: flex;
            gap: 5px;
        }
        
        .pl-head-controls button {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            padding: 5px 8px;
        }

        .playlist-item {
            padding: 12px 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }
        
        .playlist-item:hover, .playlist-item.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .playlist-item .item-actions {
            display: flex;
            gap: 8px;
        }

        .playlist-item .item-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: inherit;
            font-size: 1.1em;
            padding: 0 5px;
        }

        .playlist-item.add-btn {
            color: var(--text-color);
            font-style: italic;
            justify-content: center;
            font-weight: bold;
        }

        .hint-msg {
            text-align: center;
            justify-content: center;
            color: #888;
            font-size: 0.8em;
            font-style: italic;
            height: auto;
            transition: opacity 1s;
            opacity: 1;
            cursor: pointer;
            line-height: 1.4em;
        }
        .hint-msg.faded {
            opacity: 0;
        }
        
        .fret-controls {
            width: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-right: 1px solid var(--border-color);
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
            background: var(--bg-color);
            overflow-y: auto;
        }
        
        .fret-controls button {
            width: 100%;
            padding: 12px 0;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.1em;
            flex-shrink: 0;
        }
        
        .fret-controls .num-btn {
            font-size: 0.9em;
            font-weight: bold;
        }

        .fret-area-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-left: 40px; 
            height: 100%;
            overflow: hidden;
        }

        .string-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .string-label-item {
            width: 16.66%;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
        }

        .fret-area {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .string-container {
            display: flex;
            position: relative;
            cursor: pointer;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            height: 100%;
        }
        
        .guitar-string {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 2;
        }
        
        .guitar-string::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            background-color: var(--string-color);
            transition: background-color 0.1s;
        }
        
        .guitar-string.active-red::after {
            background-color: var(--highlight-color);
            box-shadow: 0 0 5px var(--highlight-color);
        }

        .guitar-string.vibrate::after {
            animation: vibrate 0.2s linear infinite;
        }
        
        @keyframes vibrate { 0% { transform: translateX(-51%); } 50% { transform: translateX(-49%); } 100% { transform: translateX(-51%); } }

        .fret-line {
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background-color: var(--fret-wire);
            z-index: 1;
            pointer-events: none;
        }
        
        .fret-number {
            position: absolute;
            right: 5px;
            font-size: 0.8em;
            color: #666;
            transform: translateY(-50%);
        }

        .chord-dot {
            width: 14px;
            height: 14px;
            background-color: var(--highlight-color);
            border-radius: 50%;
            position: absolute;
            z-index: 5;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
        
        .chord-dot.visible { display: block; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
        }
        
        .modal input, .modal select, .modal button {
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: inherit;
        }
        
        .modal button:hover { background: var(--glass-bg); }

        .fret-marker {
            position: absolute;
            right: -25px;
            font-size: 0.8em;
            color: var(--text-color);
            top: 50%;
            transform: translateY(-50%);
        }

        .playlist-actions {
            display: none;
            gap: 5px;
            padding: 5px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        
        .playlist-actions button {
            flex: 1;
            padding: 10px;
            background: var(--glass-bg);
            border: none;
            color: var(--text-color);
            font-family: inherit;
            cursor: pointer;
            min-width: 60px;
        }
        
        #snapBtn {
            width: 100%;
            padding: 15px;
            background: #8b0000;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: auto;
            flex-shrink: 0;
            height: 60px;
        }

        #chordPresetsContainer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
        }

        .preset-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preset-column h4 {
            margin: 0 0 5px 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            font-size: 0.9em;
        }

        .back-text-desktop { display: inline; }
        .back-text-mobile { display: none; }

        .capo-bar {
            position: absolute;
            left: 0;
            right: 0;
            height: 12px;
            background: var(--capo-color);
            z-index: 4;
            transform: translateY(-50%);
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.6;
        }

        .tab-btn.active {
            opacity: 1;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
        }

        .list-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            max-height: 300px;
        }

        .list-item {
            padding: 10px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .list-item:hover, .list-item.active {
            background: var(--glass-bg);
            border-color: var(--border-color);
        }

        @media (max-width: 768px) {
            #guitarLayout {
                flex-direction: column;
            }
            #guitarPlaylist {
                width: 100%;
                height: 180px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 35%;
            }
            #guitarFretboard {
                margin: 0;
                border: none;
                border-top: 1px solid var(--border-color);
                flex-grow: 1;
                display: flex;
                flex-direction: column;
            }
            .fret-area-wrapper {
                flex-grow: 1;
                overflow: hidden;
            }
            .string-container {
                max-width: 100%;
            }
            .string-labels {
                max-width: 100%;
            }
            #snapBtn {
                padding: 10px;
                height: 50px;
            }
            #kalimbaContainer {
                padding: 5px;
            }
            .k-tine {
                font-size: 0.6em;
            }
            .mobile-key-row {
                height: 80px;
            }
            .back-text-desktop { display: none; }
            .back-text-mobile { display: inline; }
            #chordPresetsContainer {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-height: 500px) {
            .header {
                height: 40px;
                padding: 0 10px;
            }
            .corner-btn {
                width: 30px;
                height: 30px;
                font-size: 0.9em;
            }
            .instrument-view {
                height: calc(100vh - 40px);
                height: calc(100dvh - 40px);
            }
            .controls-bar {
                height: 40px;
                padding: 2px;
                gap: 10px;
            }
            .controls-bar button {
                padding: 4px 10px;
                font-size: 0.9em;
            }
            #pianoContainer {
                padding: 2px 10px;
                gap: 5px;
            }
            .mobile-key-row {
                height: auto;
                flex: 1;
                min-height: 40px;
            }
            .mobile-key.black {
                height: 65%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="corner-btn" id="backBtn" onclick="goBack()">␛</button>
        <div style="cursor: pointer;" onclick="clearCache()">./Studio.</div>
        <div class="vol-control">
            Vol <input type="range" id="masterVol" min="0" max="2" step="0.05" value="1" oninput="updateVolume(this.value)">
            <input type="number" id="masterVolInput" value="1" step="0.05" min="0" max="2" oninput="updateVolume(this.value)">
        </div>
        <button class="corner-btn" onclick="toggleTheme()">⽉</button>
    </div>

    <div id="menuView">
        <div id="tileGrid">
            <div class="tile" onmouseenter="hoverPlay('piano')" onclick="loadInstrument('piano')">
                <div class="label-wrapper" style="--w: 5ch; --s: 5"><span>Piano</span></div>
            </div>
            <div class="tile" onmouseenter="hoverPlay('kalimba')" onclick="loadInstrument('kalimba')">
                <div class="label-wrapper" style="--w: 7ch; --s: 7"><span>Kalimba</span></div>
            </div>
            <div class="tile" onmouseenter="hoverPlay('guitar')" onclick="loadInstrument('guitar')">
                <div class="label-wrapper" style="--w: 6ch; --s: 6"><span>Guitar</span></div>
            </div>
            <div class="tile" onmouseenter="hoverPlay('daw')" onclick="window.location.href='https://xetsue.github.io/synth'">
                <div class="label-wrapper" style="--w: 3ch; --s: 3"><span>DAW</span></div>
            </div>
        </div>
    </div>

    <div id="piano" class="instrument-view">
        <div id="pianoContainer"></div>
        <div class="controls-bar">
            <button onclick="shiftOctave(-1)">-</button>
            <input type="text" id="octaveDisplay" value="0" readonly>
            <button onclick="shiftOctave(1)">+</button>
            <button onclick="openPianoTypeModal()">Type</button>
        </div>
    </div>

    <div id="kalimba" class="instrument-view">
        <div id="kalimbaContainer"></div>
        <div class="controls-bar">
             Octave: <button onclick="shiftKalimbaOctave(-1)">-</button>
            <input type="number" id="kalimbaOctaveDisplay" value="0" readonly style="width: 30px; border: none;">
            <button onclick="shiftKalimbaOctave(1)">+</button>
            | Keys: <input type="range" min="5" max="21" step="2" value="17" id="kalimbaKeys" oninput="updateKalimbaKeys(this.value)">
            <input type="number" id="kalimbaKeysInput" value="17" readonly style="width: 30px; border: none;">
        </div>
    </div>

    <div id="guitar" class="instrument-view">
        <div id="guitarLayout">
            <div id="guitarPlaylist">
                <div class="playlist-header">
                    <span id="currentPlaylistName">Default</span>
                    <div class="pl-head-controls">
                        <div id="headerExportActions" style="display:none; gap:5px;">
                            <button onclick="exportPlaylist()">E</button>
                        </div>
                        <div id="guitarHeaderBtns" style="display:flex; gap:5px;">
                            <button onclick="openGuitarTypeModal()">Type</button>
                            <button onclick="promptCapo()">Capo</button>
                        </div>
                        <button class="corner-btn" style="float: right; font-size: 0.8em; width: auto; height: auto; border: 1px solid; border-radius: 4px; color: var(--text-color); background: var(--glass-bg);" onclick="handleHeaderBack()">
                            <span class="back-text-desktop">Back</span>
                            <span class="back-text-mobile">&lt;</span>
                        </button>
                    </div>
                </div>
                <div id="playlistItems" style="flex-grow: 1; overflow-y: auto;"></div>
                <div class="playlist-actions" id="plActions">
                    <button onclick="showChordPresetList()">List</button>
                    <button onclick="saveCustomChord()">Save</button>
                </div>
            </div>
            <div id="guitarFretboard">
                <div class="fret-controls" id="fretControlBar">
                    <button onmousedown="startFretScroll(event, -1)" onmouseup="stopFretScroll()" onmouseleave="stopFretScroll()" ontouchstart="startFretScroll(event, -1)" ontouchend="stopFretScroll()">▲</button>
                    <button onmousedown="startFretScroll(event, 1)" onmouseup="stopFretScroll()" onmouseleave="stopFretScroll()" ontouchstart="startFretScroll(event, 1)" ontouchend="stopFretScroll()">▼</button>

            <div class="tab-header">
                <button class="tab-btn active" onclick="switchPianoTab('Piano')">Piano</button>
                <button class="tab-btn" onclick="switchPianoTab('Organ')">Organ</button>
                <button class="tab-btn" onclick="switchPianoTab('Guitar')">Guitar</button>
                <button class="tab-btn" onclick="switchPianoTab('Ethnic')">Ethnic</button>

    <input type="file" id="jsonInput" style="display: none;" accept=".json">

    <script>
        let audioContext;
        let player;
        let masterGain;
        let activeInstrument = null;
        let octaveOffset = 0;
        let fretOffset = 0;
        let capoFret = 0;
        let fretInterval;
        
        let kalimbaKeyCount = 17;
        let kalimbaOctave = 0;

        let currentPianoType = '0000_JCLive_sf2_file'; 
        let currentGuitarType = '0240_GeneralUserGS_sf2_file';

        let activePianoEnvelopes = {};

        const GUITAR_TYPES = [
            {name: 'Nylon', file: '0240_GeneralUserGS_sf2_file.js', var: '_tone_0240_GeneralUserGS_sf2_file'},
            {name: 'Steel', file: '0250_GeneralUserGS_sf2_file.js', var: '_tone_0250_GeneralUserGS_sf2_file'},
            {name: 'Acoustic', file: '0253_Acoustic_Guitar_sf2_file.js', var: '_tone_0253_Acoustic_Guitar_sf2_file'},
            {name: 'Jazz', file: '0260_GeneralUserGS_sf2_file.js', var: '_tone_0260_GeneralUserGS_sf2_file'},
            {name: 'Clean', file: '0270_GeneralUserGS_sf2_file.js', var: '_tone_0270_GeneralUserGS_sf2_file'},
            {name: 'Overdrive', file: '0290_GeneralUserGS_sf2_file.js', var: '_tone_0290_GeneralUserGS_sf2_file'},
            {name: 'Distortion', file: '0300_GeneralUserGS_sf2_file.js', var: '_tone_0300_GeneralUserGS_sf2_file'}
        ];

        const PIANO_TYPES = [
            {name: 'Grand Piano', file: '0000_JCLive_sf2_file.js', var: '_tone_0000_JCLive_sf2_file'},
            {name: 'E.Piano 1', file: '0040_GeneralUserGS_sf2_file.js', var: '_tone_0040_GeneralUserGS_sf2_file'},
            {name: 'E.Piano 2', file: '0051_GeneralUserGS_sf2_file.js', var: '_tone_0051_GeneralUserGS_sf2_file'},
            {name: 'Harpsichord', file: '0060_GeneralUserGS_sf2_file.js', var: '_tone_0060_GeneralUserGS_sf2_file'}
        ];

        const ORGAN_TYPES = [
            {name: 'Drawbar', file: '0160_GeneralUserGS_sf2_file.js', var: '_tone_0160_GeneralUserGS_sf2_file'},
            {name: 'Percussive', file: '0170_GeneralUserGS_sf2_file.js', var: '_tone_0170_GeneralUserGS_sf2_file'},
            {name: 'Church', file: '0190_GeneralUserGS_sf2_file.js', var: '_tone_0190_GeneralUserGS_sf2_file'}
        ];

        const ETHNIC_TYPES = [
            {name: 'Kalimba', file: '1080_GeneralUserGS_sf2_file.js', var: '_tone_1080_GeneralUserGS_sf2_file'}
        ];

        let guitarPlaylists = {
            'Default': [
                {name: 'Cmaj', shape: [0,3,2,0,1,0]},
                {name: 'Dmaj', shape: [-1,-1,0,2,3,2]},
                {name: 'Emaj', shape: [0,2,2,1,0,0]},
                {name: 'Fmaj', shape: [1,3,3,2,1,1]},
                {name: 'Gmaj', shape: [3,2,0,0,0,3]},
                {name: 'Amaj', shape: [-1,0,2,2,2,0]},
                {name: 'Bmaj', shape: [-1,2,4,4,4,2]},
                {name: 'Em', shape: [0,2,2,0,0,0]},
                {name: 'Am', shape: [-1,0,2,2,1,0]},
                {name: 'Bm', shape: [-1,2,4,4,3,2]},
                {name: 'Cm', shape: [-1,3,5,5,4,3]},
                {name: 'Dm', shape: [-1,-1,0,2,3,1]},
                {name: 'Fm', shape: [1,3,3,1,1,1]},
                {name: 'Gm', shape: [3,5,5,3,3,3]}
            ]
        };
        let currentPlaylistId = null;
        let currentChordShape = [0,0,0,0,0,0];
        let activeChordIndex = null;
        let editingChord = false;

        const KEY_MAP_PIANO = {
            'z': 48, 's': 49, 'x': 50, 'd': 51, 'c': 52, 'v': 53, 'g': 54, 'b': 55, 'h': 56, 'n': 57, 'j': 58, 'm': 59, ',': 60, 'l': 61, '.': 62, ';': 63, '/': 64,
            'q': 60, '2': 61, 'w': 62, '3': 63, 'e': 64, 'r': 65, '5': 66, 't': 67, '6': 68, 'y': 69, '7': 70, 'u': 71, 'i': 72, '9': 73, 'o': 74, '0': 75, 'p': 76
        };
        
        const KEY_MAP_KALIMBA = {
            'q':0, 'w':1, 'e':2, 'r':3, 't':4, 'y':5, 'u':6, 'i':7, 'o':8, 'p':9, '[':10, ']':11,
            'a':12, 's':13, 'd':14, 'f':15, 'g':16, 'h':17, 'j':18, 'k':19, 'l':20
        };

        const GUITAR_KEYS = ['q','w','e','r','t','y','u','i','o','p','[',']'];
        const GUITAR_STRINGS_BASE = [40, 45, 50, 55, 59, 64];

        function initAudio() {
            if(!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                player = new WebAudioFontPlayer();
                masterGain = audioContext.createGain();
                masterGain.gain.value = parseFloat(document.getElementById('masterVol').value);
                masterGain.connect(audioContext.destination);
            }
            if(audioContext.state === 'suspended') {
                 audioContext.resume().catch(e => console.log(e));
            }
        }
        
        document.addEventListener('click', () => {
            if(audioContext && audioContext.state === 'suspended') audioContext.resume();
        }, {once: true});
        document.addEventListener('keydown', () => {
            if(audioContext && audioContext.state === 'suspended') audioContext.resume();
        }, {once: true});


        window.onload = function() {
            if(localStorage.getItem('studioTheme') === 'dark') {
                document.body.classList.add('dark-theme');
            }
        };

        function clearCache() {
            localStorage.removeItem('studioTheme');
            location.reload();
        }

        function updateVolume(val) {
            document.getElementById('masterVol').value = val;
            document.getElementById('masterVolInput').value = val;
            if(masterGain) masterGain.gain.value = parseFloat(val);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('studioTheme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }

        function handleHash() {
            const hash = window.location.hash.replace('#', '');
            if(hash === 'piano' || hash === 'kalimba' || hash === 'guitar') loadInstrument(hash);
            else goBack(true);
        }

        function goBack(skipHash) {
            if(activeInstrument) {
                muteGuitar();
                document.getElementById(activeInstrument).classList.remove('active');
                document.getElementById('menuView').style.display = 'flex';
                activeInstrument = null;
                editingChord = false;
                document.getElementById('plActions').style.display = 'none';
                activeChordIndex = null;
                document.querySelectorAll('.playlist-item').forEach(d=>d.classList.remove('active'));
            }
            if(!skipHash) history.pushState("", document.title, window.location.pathname + window.location.search);
        }

        function switchView(type) {
            document.getElementById('menuView').style.display = 'none';
            document.querySelectorAll('.instrument-view').forEach(el => el.classList.remove('active'));
            document.getElementById(type).classList.add('active');
            activeInstrument = type;
            window.location.hash = type;
            if(type === 'piano') renderPiano();
            if(type === 'kalimba') renderKalimba();
            if(type === 'guitar') { renderGuitar(); loadPlaylist('Default'); }
        }

        function loadInstrument(type) {
            initAudio();
            let defVar, defFile;

            if (type === 'piano') {
                 defVar = getInstrumentVar(currentPianoType);
                 defFile = getInstrumentFile(currentPianoType, [...PIANO_TYPES, ...ORGAN_TYPES, ...GUITAR_TYPES, ...ETHNIC_TYPES]);
            } else if (type === 'kalimba') {
                 defVar = '_tone_1080_GeneralUserGS_sf2_file';
                 defFile = '1080_GeneralUserGS_sf2_file.js';
            } else if (type === 'guitar') {
                 defVar = getInstrumentVar(currentGuitarType);
                 defFile = getInstrumentFile(currentGuitarType, GUITAR_TYPES);
            }

            if (window[defVar]) {
                switchView(type);
                return;
            }
            
            try {
                if (player.loader) {
                    player.loader.startLoad(audioContext, 'js/webaudiofontdata/sound/' + defFile, defVar);
                    player.loader.waitLoad(() => switchView(type));
                } else {
                    const loader = new WebAudioFontLoader(player);
                    loader.startLoad(audioContext, 'js/webaudiofontdata/sound/' + defFile, defVar);
                    loader.waitLoad(() => switchView(type));
                }
            } catch (e) {
                const script = document.createElement('script');
                script.src = 'js/webaudiofontdata/sound/' + defFile;
                script.onload = () => switchView(type);
                document.head.appendChild(script);
            }
        }

        function getInstrumentVar(name) {
            return '_tone_' + name.replace('.js','');
        }

        function getInstrumentFile(name, list) {
            const found = list.find(i => i.var.includes(name) || i.file.includes(name));
            return found ? found.file : name + '.js';
        }

        function hoverPlay(type) {
            if(!audioContext) initAudio();
            if(audioContext.state === 'suspended') return; 

            let v = null;
            if (type === 'piano') v = window[getInstrumentVar(currentPianoType)];
            if (type === 'kalimba') v = window['_tone_1080_GeneralUserGS_sf2_file'];
            if (type === 'guitar') v = window[getInstrumentVar(currentGuitarType)];
            
            if (type === 'daw') {
                const ep2Var = '_tone_0051_GeneralUserGS_sf2_file';
                const ep2File = '0051_GeneralUserGS_sf2_file.js';
                
                if (window[ep2Var]) {
                    v = window[ep2Var];
                } else {
                    try {
                         const script = document.createElement('script');
                         script.src = 'js/webaudiofontdata/sound/' + ep2File;
                         document.head.appendChild(script);
                    } catch(e) {}
                    v = window[getInstrumentVar(currentGuitarType)]; 
                }

                if(v && masterGain) {
                    let p = 60 + Math.floor(Math.random() * 24);
                    player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, p, 0.5);
                }
                return;
            }

            if(v && masterGain) {
                let p = 60;
                if(type === 'piano') p = 24 + Math.floor(Math.random() * 72);
                if(type === 'kalimba') p = 60 + Math.floor(Math.random() * 21);
                if(type === 'guitar') p = 40 + Math.floor(Math.random() * 24);
                player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, p, 0.5);
            }
        }

        function playNote(pitch, duration = 0.5) {
            let v = null;
            if (activeInstrument === 'piano') v = window[getInstrumentVar(currentPianoType)];
            if (activeInstrument === 'kalimba') v = window['_tone_1080_GeneralUserGS_sf2_file'];
            if (activeInstrument === 'guitar') v = window[getInstrumentVar(currentGuitarType)];

            if(player && masterGain && v) {
                player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, pitch, duration);
            }
        }
        
        function startPianoNote(pitch) {
            if(activePianoEnvelopes[pitch]) return; 
            let v = window[getInstrumentVar(currentPianoType)];
            if(player && masterGain && v) {
                let envelope = player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, pitch, 9999);
                activePianoEnvelopes[pitch] = envelope;
            }
        }
        
        function stopPianoNote(pitch) {
            let envelope = activePianoEnvelopes[pitch];
            if(envelope) {
                if(envelope.cancel) {
                    envelope.cancel(); 
                } else {
                    try {
                        envelope.gain.cancelScheduledValues(audioContext.currentTime);
                        envelope.gain.setTargetAtTime(0.00001, audioContext.currentTime, 0.1);
                    } catch(e) {}
                }
                delete activePianoEnvelopes[pitch];
            }
        }

        function renderPiano() {
            const container = document.getElementById('pianoContainer');
            container.innerHTML = '';
            const shift = octaveOffset * 12;
            const activeTouches = {};
            
            const rows = [
                {start: 72, end: 95},
                {start: 48, end: 71},
                {start: 24, end: 47}
            ];

            rows.forEach(r => {
                const row = document.createElement('div');
                row.className = 'mobile-key-row';
                const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
                const whiteCount = 14; 
                const whiteWidth = 100 / whiteCount;
                let whiteIdx = 0;
                
                const start = r.start + shift;
                const end = r.end + shift;

                for(let i = start; i <= end; i++) {
                    const key = document.createElement('div');
                    const noteName = notes[i % 12];
                    const isBlack = noteName.includes('#');
                    const octave = Math.floor(i / 12) - 1;
                    key.dataset.pitch = i;
                    
                    if(!isBlack) {
                        key.className = 'mobile-key white';
                        key.style.width = `${whiteWidth}%`;
                        key.textContent = noteName + octave;
                        row.appendChild(key);
                        whiteIdx++;
                    } else {
                        key.className = 'mobile-key black';
                        key.style.left = `${(whiteIdx * whiteWidth) - (whiteWidth * 0.3)}%`;
                        key.style.width = `${whiteWidth * 0.6}%`;
                        row.appendChild(key);
                    }
                }
                
                const startNoteAction = (e, pitch, el) => {
                    startPianoNote(pitch);
                    el.classList.add('active-red');
                };

                const stopNoteAction = (e, pitch, el) => {
                    stopPianoNote(pitch);
                    el.classList.remove('active-red');
                };
                
                row.addEventListener('mousedown', (e) => {
                    if(e.target.classList.contains('mobile-key')) {
                         startNoteAction(e, parseInt(e.target.dataset.pitch), e.target);
                    }
                });
                row.addEventListener('mouseup', (e) => {
                     if(e.target.classList.contains('mobile-key')) {
                         stopNoteAction(e, parseInt(e.target.dataset.pitch), e.target);
                     }
                });
                row.addEventListener('mouseout', (e) => {
                     if(e.target.classList.contains('mobile-key')) {
                         stopNoteAction(e, parseInt(e.target.dataset.pitch), e.target);
                     }
                });
                
                row.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        const el = document.elementFromPoint(t.clientX, t.clientY);
                        if(el && el.classList.contains('mobile-key')) {
                            const pitch = parseInt(el.dataset.pitch);
                            startNoteAction(e, pitch, el);
                            activeTouches[t.identifier] = pitch;
                        }
                    }
                }, {passive:false});
                
                row.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        const el = document.elementFromPoint(t.clientX, t.clientY);
                        const newPitch = (el && el.classList.contains('mobile-key')) ? parseInt(el.dataset.pitch) : null;
                        const oldPitch = activeTouches[t.identifier];
                        
                        if (newPitch !== oldPitch) {
                            if (oldPitch !== undefined) {
                                stopPianoNote(oldPitch);
                                const oldEl = document.querySelector(`.mobile-key[data-pitch="${oldPitch}"]`);
                                if(oldEl) oldEl.classList.remove('active-red');
                                delete activeTouches[t.identifier];
                            }
                            if (newPitch !== null) {
                                startNoteAction(e, newPitch, el);
                                activeTouches[t.identifier] = newPitch;
                            }
                        }
                    }
                }, {passive:false});
                
                const handleTouchEnd = (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        const t = e.changedTouches[i];
                        const pitch = activeTouches[t.identifier];
                        if (pitch !== undefined) {
                            stopPianoNote(pitch);
                            const el = document.querySelector(`.mobile-key[data-pitch="${pitch}"]`);
                            if(el) el.classList.remove('active-red');
                            delete activeTouches[t.identifier];
                        }
                    }
                };

                row.addEventListener('touchend', handleTouchEnd, {passive:false});
                row.addEventListener('touchcancel', handleTouchEnd, {passive:false});
                
                window.addEventListener('mouseup', () => {
                     Object.keys(activePianoEnvelopes).forEach(p => stopPianoNote(p));
                     document.querySelectorAll('.mobile-key.active-red').forEach(k => k.classList.remove('active-red'));
                });

                container.appendChild(row);
            });
        }

        function shiftOctave(dir) {
            octaveOffset += dir;
            document.getElementById('octaveDisplay').value = octaveOffset;
            renderPiano();
        }

        function updateKalimbaKeys(val) {
            kalimbaKeyCount = parseInt(val);
            document.getElementById('kalimbaKeysInput').value = kalimbaKeyCount;
            renderKalimba();
        }
        
        function shiftKalimbaOctave(dir) {
            kalimbaOctave += dir;
            document.getElementById('kalimbaOctaveDisplay').value = kalimbaOctave;
            renderKalimba();
        }

        function renderKalimba() {
            const container = document.getElementById('kalimbaContainer');
            container.innerHTML = '';
            
            const baseNotes = ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6','D6','E6','F6','G6','A6','B6'];
            const basePitches = [60,62,64,65,67,69,71,72,74,76,77,79,81,83,84,86,88,89,91,93,95];
            
            const fullMap = baseNotes.map((n, i) => ({
                name: n,
                pitch: basePitches[i] + (kalimbaOctave * 12)
            }));

            const center = fullMap[0];
            const leftSeq = [];
            const rightSeq = [];
            
            for(let i=1; i<fullMap.length; i++) {
                if(i % 2 !== 0) leftSeq.push(fullMap[i]); 
                else rightSeq.push(fullMap[i]); 
            }

            const sideCount = (kalimbaKeyCount - 1) / 2;
            const renderLeft = leftSeq.slice(0, sideCount).reverse();
            const renderRight = rightSeq.slice(0, sideCount);
            
            const keysToRender = [...renderLeft, center, ...renderRight];
            const maxH = 100;
            
            keysToRender.forEach((k, i) => {
                const tine = document.createElement('div');
                tine.className = 'k-tine';
                tine.textContent = k.name;
                tine.dataset.pitch = k.pitch;
                
                const distFromCenter = Math.abs(i - Math.floor(keysToRender.length/2));
                const h = maxH - (distFromCenter * 4); 
                tine.style.height = h + '%';
                
                container.appendChild(tine);
            });

            const handleSwipe = (e) => {
                 if(e.type.startsWith('mouse') && e.buttons !== 1) return;
                 e.preventDefault();
                 const points = e.changedTouches ? Array.from(e.changedTouches) : [e];
                 
                 points.forEach(p => {
                     const el = document.elementFromPoint(p.clientX, p.clientY);
                     if(el && el.classList.contains('k-tine')) {
                         if(!el.classList.contains('active-red')) {
                             playNote(parseInt(el.dataset.pitch), 1.5);
                             el.classList.add('active-red');
                             setTimeout(() => el.classList.remove('active-red'), 100);
                         }
                     }
                 });
            };
            container.onmousedown = handleSwipe;
            container.onmousemove = handleSwipe;
            container.ontouchstart = handleSwipe;
            container.ontouchmove = handleSwipe;
        }

        function muteGuitar() {
            if(player) player.cancelQueue(audioContext);
        }
        
        function snapGuitar(e) {
            if(e) { e.preventDefault(); e.stopPropagation(); }
            const v = window[getInstrumentVar(currentGuitarType)];
            if(!audioContext || !v) return;
            player.cancelQueue(audioContext);
            
            let p = [];
            for(let i=0; i<6; i++) {
                let f = currentChordShape[i];
                if(f > -1) {
                    let finalFret = f === 0 ? capoFret : f;
                    p.push(GUITAR_STRINGS_BASE[i] + finalFret);
                }
            }
            if(p.length > 0) {
                player.queueSnap(audioContext, masterGain, v, audioContext.currentTime, p, 1.5);
            }
        }

        function renderGuitar() {
            const area = document.getElementById('fretArea');
            area.innerHTML = '';
            
            const wrapper = document.querySelector('.fret-area-wrapper');
            wrapper.onwheel = (e) => { e.preventDefault(); shiftFretView(e.deltaY > 0 ? 1 : -1); };

            const stringsDiv = document.createElement('div');
            stringsDiv.className = 'string-container';
            stringsDiv.id = 'stringsLayer';
            
            for(let i=0; i<6; i++) {
                const s = document.createElement('div');
                s.className = 'guitar-string';
                s.dataset.string = i;
                stringsDiv.appendChild(s);
            }
            area.appendChild(stringsDiv);

            const fretHeight = 100 / 12;
            for(let i=0; i<12; i++) {
                const fretLine = document.createElement('div');
                fretLine.className = 'fret-line';
                fretLine.style.top = `${(i+1)*fretHeight}%`;
                area.appendChild(fretLine);
                const num = document.createElement('span');
                num.className = 'fret-number';
                num.textContent = fretOffset + i + 1;
                num.style.top = `${(i+1)*fretHeight - 2}%`;
                area.appendChild(num);
                
                if (capoFret === fretOffset + i + 1) {
                    const bar = document.createElement('div');
                    bar.className = 'capo-bar';
                    bar.style.top = `${(i+1)*fretHeight - (fretHeight/2)}%`;
                    area.appendChild(bar);
                }
            }

            const strum = (idx) => {
                const strEl = stringsDiv.children[idx];
                if(!strEl.classList.contains('vibrate')) {
                    strEl.classList.add('vibrate');
                    strEl.classList.add('active-red');
                    setTimeout(() => { strEl.classList.remove('vibrate'); strEl.classList.remove('active-red'); }, 200);
                    
                    let fret = currentChordShape[idx];
                    let finalFret = fret === -1 ? -1 : (fret === 0 ? capoFret : fret);
                    let p = GUITAR_STRINGS_BASE[idx] + (finalFret === -1 ? 0 : finalFret);
                    
                    const v = window[getInstrumentVar(currentGuitarType)];
                    if(v) {
                        player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, p, 1.5);
                    }
                }
            };

            const handleStrum = (e) => {
                if(editingChord) return;
                if(!audioContext) initAudio();
                const rect = stringsDiv.getBoundingClientRect();
                const points = e.changedTouches ? Array.from(e.changedTouches) : [e];
                
                points.forEach(p => {
                    const x = p.clientX - rect.left;
                    const widthPerString = rect.width / 6;
                    const stringIdx = Math.floor(x / widthPerString);
                    if(stringIdx >= 0 && stringIdx < 6) strum(stringIdx);
                });
            };

            const handleEditTap = (x, y) => {
                const rect = stringsDiv.getBoundingClientRect();
                const relX = x - rect.left;
                const relY = y - rect.top;
                
                const strIdx = Math.floor(relX / (rect.width/6));
                if(strIdx < 0 || strIdx > 5) return;

                const areaRect = area.getBoundingClientRect();
                const fHeight = areaRect.height / 12;
                const fretRow = Math.floor(relY / fHeight);
                
                if(fretRow < 0 || fretRow > 11) return;

                const actualFret = fretOffset + fretRow + 1;
                if(currentChordShape[strIdx] === actualFret) currentChordShape[strIdx] = 0;
                else currentChordShape[strIdx] = actualFret;
                renderChordDots();
            };

            stringsDiv.addEventListener('mousemove', (e) => { if(e.buttons===1) handleStrum(e); });
            stringsDiv.addEventListener('touchmove', (e) => { e.preventDefault(); handleStrum(e); }, {passive:false});
            stringsDiv.addEventListener('mousedown', handleStrum);
            
            stringsDiv.addEventListener('click', (e) => {
                if(editingChord) handleEditTap(e.clientX, e.clientY);
            });

            stringsDiv.addEventListener('touchstart', (e) => { 
                if(editingChord) {
                     e.preventDefault();
                     const t = e.changedTouches[0];
                     handleEditTap(t.clientX, t.clientY);
                } else {
                     e.preventDefault(); 
                     handleStrum(e); 
                }
            }, {passive:false});

            renderChordDots();
        }

        function renderChordDots() {
            const container = document.getElementById('stringsLayer');
            if(!container) return;
            document.querySelectorAll('.chord-dot').forEach(d => d.remove());
            document.querySelectorAll('.fret-marker').forEach(d => d.remove());
            currentChordShape.forEach((fret, strIdx) => {
                if(capoFret > 0 && fret > 0 && fret <= capoFret) return;
                
                if(fret > 0 && fret > fretOffset && fret <= fretOffset + 12) {
                    const relativeFret = fret - fretOffset;
                    const dot = document.createElement('div');
                    dot.className = 'chord-dot visible';
                    const leftPos = (strIdx * (100/6)) + (100/12);
                    dot.style.left = `${leftPos}%`;
                    const fretHeight = 100 / 12;
                    dot.style.top = `${(relativeFret - 0.5) * fretHeight}%`;
                    const hint = document.createElement('span');
                    hint.textContent = fret;
                    hint.className = 'fret-marker';
                    hint.style.top = `${(relativeFret - 0.5) * fretHeight}%`;
                    container.appendChild(dot);
                    container.appendChild(hint);
                }
            });
        }

        function shiftFretView(offset) {
            fretOffset += offset;
            if(fretOffset < 0) fretOffset = 0;
            renderGuitar();
        }
        
        function startFretScroll(e, dir) {
            if(e.cancelable) e.preventDefault();
            shiftFretView(dir);
            if(fretInterval) clearInterval(fretInterval);
            fretInterval = setInterval(() => shiftFretView(dir), 100);
        }
        
        function stopFretScroll() {
            if(fretInterval) clearInterval(fretInterval);
        }

        function handleHeaderBack() {
            if(editingChord) {
                editingChord = false;
                document.getElementById('plActions').style.display = 'none';
                loadPlaylist(currentPlaylistId);
            } else {
                exitPlaylist();
            }
        }

        function loadPlaylist(name) {
            currentPlaylistId = name;
            document.getElementById('currentPlaylistName').textContent = name;
            const container = document.getElementById('playlistItems');
            container.innerHTML = '';
            
            document.getElementById('plActions').style.display = 'none';
            document.getElementById('headerExportActions').style.display = name === 'Default' ? 'none' : 'flex';
            document.getElementById('guitarHeaderBtns').style.display = 'flex';

            const fretNumContainer = document.getElementById('fretNumContainer');
            fretNumContainer.innerHTML = '';

            if(guitarPlaylists[name]) {
                guitarPlaylists[name].forEach((chord, i) => {
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    if(activeChordIndex === i) div.classList.add('active');
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = `${(i+1)}. ${chord.name.replace(/^\d+\.\s*/, '')}`;
                    div.appendChild(nameSpan);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'item-actions';
                    
                    const renBtn = document.createElement('button');
                    renBtn.textContent = 'R';
                    renBtn.onclick = (e) => { e.stopPropagation(); renameChord(i); };
                    
                    const delBtn = document.createElement('button');
                    delBtn.textContent = 'x';
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteChord(i); };

                    actionsDiv.appendChild(renBtn);
                    actionsDiv.appendChild(delBtn);
                    div.appendChild(actionsDiv);

                    div.onclick = () => {
                        if (activeChordIndex === i) {
                            activeChordIndex = null;
                            currentChordShape = [0,0,0,0,0,0];
                            div.classList.remove('active');
                        } else {
                            activeChordIndex = i;
                            currentChordShape = chord.shape.map(s => s > 0 ? s + capoFret : s);
                            document.querySelectorAll('.playlist-item').forEach(d=>d.classList.remove('active'));
                            div.classList.add('active');
                        }
                        renderChordDots();
                        editingChord = false;
                        document.getElementById('plActions').style.display = 'none';
                    };
                    
                    container.appendChild(div);

                    if (i < 10) {
                        const numBtn = document.createElement('button');
                        numBtn.textContent = i + 1;
                        numBtn.className = 'num-btn';
                        numBtn.onclick = () => {
                             if(guitarPlaylists[currentPlaylistId][i]) {
                                 const items = document.querySelectorAll('.playlist-item');
                                 if(items[i]) items[i].click();
                             }
                        };
                        fretNumContainer.appendChild(numBtn);
                    }
                });

                if (name !== 'Default') {
                    const addBtn = document.createElement('div');
                    addBtn.className = 'playlist-item add-btn';
                    addBtn.textContent = 'Add +';
                    addBtn.onclick = () => startAddChordFlow();
                    container.appendChild(addBtn);
                }
            }
        }
        
        function startAddChordFlow() {
            activeChordIndex = -1; 
            currentChordShape = [0,0,0,0,0,0];
            renderChordDots();
            editingChord = true;
            document.querySelectorAll('.playlist-item').forEach(d=>d.classList.remove('active'));
            document.getElementById('plActions').style.display = 'flex';

            const container = document.getElementById('playlistItems');
            const existing = document.getElementById('tempHint');
            if(existing) existing.remove();

            const hint = document.createElement('div');
            hint.id = 'tempHint';
            hint.className = 'playlist-item hint-msg';
            hint.innerHTML = '<span>Interact With The Guitar<br>To Add Custom Notes</span>';
            
            let fadeTimer;
            const startFade = () => {
                clearTimeout(fadeTimer);
                hint.classList.remove('faded');
                fadeTimer = setTimeout(() => hint.classList.add('faded'), 10000);
            };
            
            hint.onclick = startFade;
            container.appendChild(hint);
            container.scrollTop = container.scrollHeight;
            startFade();
        }

        function deleteChord(idx) {
            if(confirm("Delete this chord?")) {
                guitarPlaylists[currentPlaylistId].splice(idx, 1);
                loadPlaylist(currentPlaylistId);
            }
        }
        function renameChord(idx) {
            const n = prompt("New Name:", guitarPlaylists[currentPlaylistId][idx].name.replace(/^\d+\.\s*/, ''));
            if(n) {
                guitarPlaylists[currentPlaylistId][idx].name = n;
                loadPlaylist(currentPlaylistId);
            }
        }
        
        function exitPlaylist() {
            currentPlaylistId = null;
            document.getElementById('currentPlaylistName').textContent = "Playlists";
            const container = document.getElementById('playlistItems');
            container.innerHTML = '';
            document.getElementById('fretNumContainer').innerHTML = '';

            const defDiv = document.createElement('div');
            defDiv.className = 'playlist-item';
            defDiv.textContent = 'Default';
            defDiv.onclick = () => loadPlaylist('Default');
            container.appendChild(defDiv);
            Object.keys(guitarPlaylists).forEach(k => {
                if(k === 'Default') return;
                const div = document.createElement('div');
                div.className = 'playlist-item';
                div.textContent = k;
                div.onclick = () => loadPlaylist(k);
                div.oncontextmenu = (e) => {
                    e.preventDefault();
                    if(confirm("Delete playlist?")) {
                        delete guitarPlaylists[k];
                        exitPlaylist();
                    }
                };
                container.appendChild(div);
            });
            const addDiv = document.createElement('div');
            addDiv.className = 'playlist-item';
            addDiv.textContent = '+ New Playlist';
            addDiv.style.color = 'var(--string-color)';
            addDiv.onclick = () => document.getElementById('nameModal').style.display = 'flex';
            container.appendChild(addDiv);
            document.getElementById('plActions').style.display = 'none';
            document.getElementById('headerExportActions').style.display = 'none';
            document.getElementById('guitarHeaderBtns').style.display = 'flex';
            activeChordIndex = null;
            currentChordShape = [0,0,0,0,0,0];
            renderChordDots();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function createPlaylist() {
            const name = document.getElementById('newPlaylistName').value;
            if(name) {
                guitarPlaylists[name] = [];
                closeModal('nameModal');
                exitPlaylist();
            }
        }
        
        function saveCustomChord() {
            if(editingChord && activeChordIndex > -1 && activeChordIndex < guitarPlaylists[currentPlaylistId].length) {
                const baseShape = currentChordShape.map(s => s > 0 ? Math.max(0, s - capoFret) : s);
                guitarPlaylists[currentPlaylistId][activeChordIndex].shape = baseShape;
                loadPlaylist(currentPlaylistId);
            } else if (editingChord) {
                let name = prompt("Chord Name:");
                if(!name) {
                    name = "Custom Chord";
                }
                if(name && currentPlaylistId) {
                    const baseShape = currentChordShape.map(s => s > 0 ? Math.max(0, s - capoFret) : s);
                    guitarPlaylists[currentPlaylistId].push({ name: name, shape: baseShape });
                    loadPlaylist(currentPlaylistId);
                }
            }
        }

        function showChordPresetList() {
            const m = document.getElementById('chordListModal');
            const c = document.getElementById('chordPresetsContainer');
            c.innerHTML = '';
            
            const cols = ['maj', 'm', '#', 'b'];
            const colDivs = {};
            
            cols.forEach(lbl => {
                const col = document.createElement('div');
                col.className = 'preset-column';
                let title = lbl;
                if(lbl === 'maj') title = 'Major';
                if(lbl === 'm') title = 'Minor';
                if(lbl === '#') title = 'Sharp (#)';
                if(lbl === 'b') title = 'Flat (b)';
                col.innerHTML = `<h4>${title}</h4>`;
                colDivs[lbl] = col;
                c.appendChild(col);
            });
            
            const presets = [...guitarPlaylists['Default']]; 
            
            presets.forEach(p => {
                const btn = document.createElement('button');
                let cleanName = p.name.replace(/^\d+\.\s*/, '');
                btn.textContent = cleanName;
                btn.style.textAlign = 'left';
                btn.onclick = () => {
                    const finalShape = p.shape.map(s => s > 0 ? s + capoFret : (s === 0 ? capoFret : s));
                    if (editingChord && activeChordIndex === -1) {
                         guitarPlaylists[currentPlaylistId].push({name: cleanName, shape: [...p.shape]});
                         loadPlaylist(currentPlaylistId);
                    } else if (editingChord && activeChordIndex > -1) {
                         currentChordShape = finalShape;
                         renderChordDots();
                    }
                    closeModal('chordListModal');
                };

                if (cleanName.includes('#')) colDivs['#'].appendChild(btn);
                else if (cleanName.includes('b')) colDivs['b'].appendChild(btn);
                else if (cleanName.includes('m') && !cleanName.includes('maj')) colDivs['m'].appendChild(btn);
                else colDivs['maj'].appendChild(btn);
            });
            
            m.style.display = 'flex';
        }

        function openGuitarTypeModal() {
            const list = document.getElementById('guitarTypeList');
            list.innerHTML = '';
            GUITAR_TYPES.forEach(g => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.textContent = g.name;
                if(currentGuitarType.includes(g.name)) div.classList.add('active');
                div.onclick = () => {
                    currentGuitarType = g.file.replace('.js','');
                    loadInstrument('guitar');
                    closeModal('guitarTypeModal');
                };
                list.appendChild(div);
            });
            document.getElementById('guitarTypeModal').style.display = 'flex';
        }

        function promptCapo() {
            const val = prompt("Enter Capo Fret (0-11):", capoFret);
            if(val !== null) {
                const n = parseInt(val);
                if(!isNaN(n) && n >= 0 && n <= 11) {
                    const diff = n - capoFret;
                    capoFret = n;
                    currentChordShape = currentChordShape.map(f => {
                        if(f <= 0 && f !== -1 && diff > 0) return f + diff; 
                        if(f > 0) return f + diff;
                        return f;
                    });
                    if(currentPlaylistId && activeChordIndex !== null) {
                        loadPlaylist(currentPlaylistId); 
                    }
                    renderGuitar();
                    renderChordDots();
                }
            }
        }

        function openPianoTypeModal() {
            switchPianoTab('Piano');
            document.getElementById('pianoTypeModal').style.display = 'flex';
        }

        function switchPianoTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => { if(b.textContent === tab) b.classList.add('active'); });
            
            const list = document.getElementById('pianoTypeList');
            list.innerHTML = '';
            let data = [];
            if(tab === 'Piano') data = PIANO_TYPES;
            if(tab === 'Organ') data = ORGAN_TYPES;
            if(tab === 'Guitar') data = GUITAR_TYPES;
            if(tab === 'Ethnic') data = ETHNIC_TYPES;
            
            data.forEach(d => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.textContent = d.name;
                if(currentPianoType.includes(d.name.replace(/\s/g,'_'))) div.classList.add('active');
                div.onclick = () => {
                    currentPianoType = d.file.replace('.js','');
                    loadInstrument('piano');
                    closeModal('pianoTypeModal');
                };
                list.appendChild(div);
            });
        }
        
        function exportPlaylist() {
            if(!currentPlaylistId) return;
            const data = JSON.stringify(guitarPlaylists[currentPlaylistId]);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = currentPlaylistId + '.json';
            a.click();
        }
        
        function importPlaylistTrigger() { 
            document.getElementById('jsonInput').click(); 
            closeModal('nameModal');
        }
        
        document.getElementById('jsonInput').addEventListener('change', (e) => {
            const f = e.target.files[0];
            if(f) {
                const r = new FileReader();
                r.onload = (ev) => {
                    const name = f.name.replace('.json','');
                    guitarPlaylists[name] = JSON.parse(ev.target.result);
                    exitPlaylist();
                };
                r.readAsText(f);
            }
        });

        window.addEventListener('hashchange', handleHash);
        window.addEventListener('load', handleHash);

        document.addEventListener('keydown', (e) => {
            if(document.querySelector('.modal-overlay').style.display === 'flex') return;
            if(e.code === 'Escape') goBack();
            if(e.repeat && activeInstrument !== 'piano') return;
            
            const key = e.key.toLowerCase();

            if(activeInstrument === 'piano') {
                if(e.key === 'ArrowUp') { e.preventDefault(); shiftOctave(1); return; }
                if(e.key === 'ArrowDown') { e.preventDefault(); shiftOctave(-1); return; }

                if(KEY_MAP_PIANO[key]) {
                    const pitch = KEY_MAP_PIANO[key] + (octaveOffset * 12);
                    if(!e.repeat) {
                        startPianoNote(pitch);
                        const kEl = document.querySelector(`.mobile-key[data-pitch="${pitch}"]`);
                        if(kEl) kEl.classList.add('active-red');
                    }
                }
            } else if (activeInstrument === 'kalimba') {
                 if(e.key === 'ArrowUp') { e.preventDefault(); shiftKalimbaOctave(1); return; }
                 if(e.key === 'ArrowDown') { e.preventDefault(); shiftKalimbaOctave(-1); return; }
                 
                 if(KEY_MAP_KALIMBA[key] !== undefined) {
                    const idx = KEY_MAP_KALIMBA[key];
                    const tines = Array.from(document.querySelectorAll('.k-tine'));
                    if(idx < tines.length) {
                        const targetTine = tines[idx];
                        const pitch = parseInt(targetTine.dataset.pitch);
                        playNote(pitch, 1.5);
                        targetTine.classList.add('active-red');
                        setTimeout(() => targetTine.classList.remove('active-red'), 100);
                    }
                }
            } else if (activeInstrument === 'guitar') {
                 const v = window[getInstrumentVar(currentGuitarType)];
                 
                 if(e.shiftKey) { e.preventDefault(); snapGuitar(); return; }
                 if(e.key === 'ArrowUp') { e.preventDefault(); shiftFretView(-1); return; }
                 if(e.key === 'ArrowDown') { e.preventDefault(); shiftFretView(1); return; }
                 
                 if(e.code === 'ArrowRight' || e.code === 'Space') {
                     e.preventDefault();
                     for(let i=0; i<6; i++) { setTimeout(() => {
                         const strEl = document.querySelectorAll('.guitar-string')[i];
                         if(strEl) {
                             strEl.classList.add('vibrate'); strEl.classList.add('active-red');
                             setTimeout(() => { strEl.classList.remove('vibrate'); strEl.classList.remove('active-red'); }, 150);
                             let f = currentChordShape[i]; 
                             let finalFret = f === -1 ? -1 : (f === 0 ? capoFret : f);
                             let pitch = GUITAR_STRINGS_BASE[i] + (finalFret === -1 ? 0 : finalFret);
                             if(v) {
                                 player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, pitch, 1.5);
                             }
                         }
                     }, i * 30); }
                 }
                 if(e.code === 'ArrowLeft') {
                     e.preventDefault();
                     for(let i=5; i>=0; i--) { setTimeout(() => {
                         const strEl = document.querySelectorAll('.guitar-string')[i];
                         if(strEl) {
                             strEl.classList.add('vibrate'); strEl.classList.add('active-red');
                             setTimeout(() => { strEl.classList.remove('vibrate'); strEl.classList.remove('active-red'); }, 150);
                             let f = currentChordShape[i];
                             let finalFret = f === -1 ? -1 : (f === 0 ? capoFret : f);
                             let pitch = GUITAR_STRINGS_BASE[i] + (finalFret === -1 ? 0 : finalFret);
                             if(v) {
                                 player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, pitch, 1.5);
                             }
                         }
                     }, (5-i) * 30); }
                 }

                 const idx = GUITAR_KEYS.indexOf(key);
                 if(idx > -1) {
                     const strIdx = idx % 6;
                     const fret = currentChordShape[strIdx];
                     let finalFret = fret === -1 ? -1 : (fret === 0 ? capoFret : fret);
                     const pitch = GUITAR_STRINGS_BASE[strIdx] + (finalFret === -1 ? 0 : finalFret);
                     if(player && audioContext && masterGain && v) {
                        player.queueWaveTable(audioContext, masterGain, v, audioContext.currentTime, pitch, 1.5);
                     }
                     const strEl = document.querySelectorAll('.guitar-string')[strIdx];
                     if(strEl) {
                         strEl.classList.add('vibrate');
                         strEl.classList.add('active-red');
                         setTimeout(() => { strEl.classList.remove('vibrate'); strEl.classList.remove('active-red'); }, 200);
                     }
                 }
                 
                 if(key >= '1' && key <= '9') {
                     const i = parseInt(key) - 1;
                     if(currentPlaylistId && guitarPlaylists[currentPlaylistId][i]) {
                         const items = document.querySelectorAll('.playlist-item');
                         if(items[i]) items[i].click();
                     }
                 }
                 if (key === '0') {
                    if(currentPlaylistId && guitarPlaylists[currentPlaylistId][9]) {
                         const items = document.querySelectorAll('.playlist-item');
                         if(items[9]) items[9].click();
                     }
                 }
            }
        });

        document.addEventListener('keyup', (e) => {
            if(activeInstrument === 'piano') {
                 const key = e.key.toLowerCase();
                 if(KEY_MAP_PIANO[key]) {
                    const pitch = KEY_MAP_PIANO[key] + (octaveOffset * 12);
                    stopPianoNote(pitch);
                    const kEl = document.querySelector(`.mobile-key[data-pitch="${pitch}"]`);
                    if(kEl) kEl.classList.remove('active-red');
                 }
            }
        });
        
        exitPlaylist();
    </script>
</body>
